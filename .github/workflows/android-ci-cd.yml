name: Android CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/*_apps']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

  release_production:
    name: Build and publish to Production
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/heads/release/') &&
      endsWith(github.ref_name, '_apps') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: google-play-production
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Validate release branch
        id: release_version
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          version="${branch#release/}"
          version="${version%_apps}"
          build_name="${version%%+*}"
          build_number="${version#*+}"

          if [[ "$branch" != release/*_apps || "$version" != *+* || ! "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Release branches must use release/<major>.<minor>.<patch>+<positive-build-number>_apps, for example release/1.2.2+3_apps."
            exit 1
          fi

          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml)"
          if [[ "$version" != "$pubspec_version" ]]; then
            echo "::error::Release branch $branch must match pubspec.yaml version $pubspec_version."
            exit 1
          fi

          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Android signing and Play credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ${secret_name}"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value: str) -> str:
              escaped = []
              for char in value:
                  codepoint = ord(char)
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char in (" ", ":", "=", "#", "!"):
                      escaped.append("\\" + char)
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char == "\n":
                      escaped.append("\\n")
                  elif char == "\r":
                      escaped.append("\\r")
                  elif codepoint < 0x20 or codepoint > 0x7E:
                      encoded = char.encode("utf-16-be")
                      escaped.extend(f"\\u{int.from_bytes(encoded[index:index + 2], 'big'):04x}" for index in range(0, len(encoded), 2))
                  else:
                      escaped.append(char)
              return "".join(escaped)

          properties = {
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": "upload-keystore.jks",
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          PY
          chmod 600 android/key.properties

      - name: Build signed Android App Bundle
        run: >-
          flutter build appbundle --release
          --build-name "${{ steps.release_version.outputs.build_name }}"
          --build-number "${{ steps.release_version.outputs.build_number }}"

      - name: Save Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pujangga-pos-${{ steps.release_version.outputs.build_name }}+${{ steps.release_version.outputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to 10% Production rollout
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pujanggapos.pujangga_pos
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: inProgress
          userFraction: 0.1

      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f android/key.properties android/app/upload-keystore.jks

  complete_production_rollout:
    name: Complete Production rollout
    needs: [verify, release_production]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      ((github.event_name == 'push' && needs.release_production.result == 'success') ||
      github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/heads/release/') &&
      endsWith(github.ref_name, '_apps')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: google-play-production
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Validate release branch and version
        id: release_version
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          version="${branch#release/}"
          version="${version%_apps}"
          build_number="${version#*+}"

          if [[ "$branch" != release/*_apps || "$version" != *+* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
            echo "::error::Release branches must use release/<major>.<minor>.<patch>+<positive-build-number>_apps."
            exit 1
          fi

          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml)"
          if [[ "$version" != "$pubspec_version" ]]; then
            echo "::error::Release branch $branch must match pubspec.yaml version $pubspec_version."
            exit 1
          fi

          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Complete the matching in-progress Play release
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.release_version.outputs.build_number }}
        run: |
          python3 -m pip install --disable-pip-version-check 'google-api-python-client==2.187.0'
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          package_name = "com.pujanggapos.pujangga_pos"
          version_code = int(os.environ["VERSION_CODE"])
          service_account_info = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              service_account_info,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          credentials.refresh(Request())

          api_root = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/"
          application = urllib.parse.quote(package_name, safe="")

          def request(method, url, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"Authorization": f"Bearer {credentials.token}"}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      content = response.read()
                      return json.loads(content) if content else {}
              except urllib.error.HTTPError as error:
                  # Log only the structured diagnostic fields, never the full response body.
                  try:
                      response_payload = json.loads(error.read().decode("utf-8"))
                      response_error = response_payload.get("error", {}) if isinstance(response_payload, dict) else {}
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      response_error = {}
                  if not isinstance(response_error, dict):
                      response_error = {}
                  reasons = response_error.get("errors", [])
                  if not isinstance(reasons, list):
                      reasons = []
                  reasons = sorted({
                      item["reason"] for item in reasons
                      if isinstance(item, dict) and isinstance(item.get("reason"), str)
                  })
                  status = response_error.get("status")
                  message = response_error.get("message")
                  details = []
                  if isinstance(status, str):
                      details.append(f"status={status}")
                  if reasons:
                      details.append(f"reasons={','.join(reasons)}")
                  if isinstance(message, str):
                      message = message.replace("\r", " ").replace("\n", " ")[:500]
                      details.append(f"message={message}")
                  suffix = f" ({'; '.join(details)})" if details else " (no structured error details returned)"
                  print(f"::error::Android Publisher API returned HTTP {error.code} for {method}{suffix}.")
                  sys.exit(1)

          edit = request("POST", api_root + application + "/edits")
          edit_id = edit["id"]
          edit_url = api_root + application + "/edits/" + urllib.parse.quote(edit_id, safe="")

          def discard_edit():
              request("DELETE", edit_url)

          track = request("GET", edit_url + "/tracks/production")
          releases = track.get("releases", [])
          matching = [
              release for release in releases
              if str(version_code) in [str(code) for code in release.get("versionCodes", [])]
          ]

          if len(matching) != 1:
              discard_edit()
              print(f"::error::Expected exactly one Production release for versionCode {version_code}; found {len(matching)}.")
              sys.exit(1)

          release = matching[0]
          if [str(code) for code in release.get("versionCodes", [])] != [str(version_code)]:
              discard_edit()
              print("::error::The matching Production release contains additional version codes; refusing to change it.")
              sys.exit(1)

          if release.get("status") == "completed":
              discard_edit()
              print(f"Production release versionCode {version_code} is already completed (100% rollout). No change made.")
              sys.exit(0)

          if release.get("status") != "inProgress":
              discard_edit()
              print(f"::error::Expected an inProgress Production release for versionCode {version_code}; found {release.get('status', 'unset')}.")
              sys.exit(1)

          fraction = release.get("userFraction")
          if not isinstance(fraction, (int, float)) or not 0 < fraction < 1:
              discard_edit()
              print("::error::The matching inProgress release does not have a valid staged rollout fraction; refusing to change it.")
              sys.exit(1)

          release["status"] = "completed"
          release.pop("userFraction", None)
          request("PUT", edit_url + "/tracks/production", track)
          request("POST", edit_url + ":commit")
          print(f"Production release versionCode {version_code} completed (100% rollout). No bundle was rebuilt or uploaded.")
          PY
