name: pujangga-pr-agent
services:
  reviewer:
    image: pujangga-pr-agent:251eddf
    build:
      context: ./source
      dockerfile: docker/Dockerfile
      target: github_app
    restart: unless-stopped
    command: ["python", "-m", "gunicorn", "-k", "uvicorn_worker.UvicornWorker", "-c", "pr_agent/servers/gunicorn_config.py", "bootstrap:app"]
    ports:
      - "127.0.0.1:8095:3000"
    group_add:
      - "1000"
    environment:
      GUNICORN_WORKERS: "2"
      LOG_LEVEL: WARNING
    volumes:
      - ./private:/app/pr_agent/settings_prod:ro
      - ./smoke.py:/deployment/smoke.py:ro
      - ./codex_lb.py:/app/codex_lb.py:ro
      - ./bootstrap.py:/app/bootstrap.py:ro
      - ./formal_review.py:/app/formal_review.py:ro
      - ./id.toml:/app/pr_agent/settings/i18n/id.toml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
